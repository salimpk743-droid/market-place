<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone listing - MobileWheels PK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="application-name" content="Mobile Market">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mobile Market">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
      <a href="index.html" class="text-2xl font-bold tracking-wide">Mobile<span class="text-yellow-400">Wheels</span></a>
      <nav class="hidden md:flex space-x-6 font-medium">
        <a href="phones.html" class="hover:text-yellow-300">Used Phones</a>
        <a href="my-ads.html" class="hover:text-yellow-300">My Ads</a>
      </nav>
      <a href="sell.html" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold px-4 py-2 rounded-lg text-sm shadow">+ Post An Ad</a>
    </div>
  </header>

  <main id="main" class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full"></main>

  <footer class="bg-gray-900 text-gray-400 py-8 border-t">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4 text-sm">
      <p>&copy; 2026 MobileWheels PK. All rights reserved.</p>
      <div class="flex space-x-6">
        <a href="index.html" class="hover:text-white">Home</a>
        <a href="phones.html" class="hover:text-white">Used Phones</a>
        <a href="my-ads.html" class="hover:text-white">My Ads</a>
        <a href="privacy.html" class="hover:text-white">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const ui = MW.ui;
    const listing = ui.getListing(ui.qs("id"));
    const main = document.getElementById("main");

    if (!listing) {
      main.innerHTML = '<div class="max-w-xl mx-auto text-center py-20"><h1 class="text-3xl font-bold">Listing not found</h1><p class="mt-2 text-gray-500">It may have been sold or removed.</p><a href="phones.html" class="mt-6 inline-block text-blue-700 underline">Back to used phones</a></div>';
    } else {
      document.title = ui.listingTitle(listing) + " - MobileWheels PK";
      const pta = ui.ptaMeta(listing.ptaStatus);
      const specs = [
        listing.storageGb ? ["Storage", listing.storageGb + " GB"] : null,
        listing.ramGb ? ["RAM", listing.ramGb + " GB"] : null,
        listing.batteryHealth ? ["Battery", listing.batteryHealth + "%"] : null,
        listing.condition ? ["Condition", listing.condition] : null,
        listing.color ? ["Color", listing.color] : null,
        listing.year ? ["Year", String(listing.year)] : null,
        ["PTA", pta.label],
      ].filter(Boolean);
      const related = ui.filterListings({ brand: listing.brand }).filter((r) => r.id !== listing.id).slice(0, 3);
      const img = listing.imageUrl || ui.brandImage(listing.brand, listing.model);
      const phone = listing.contactPhone || "";
      const mine = ui.isMine(listing.id);

      const sellerTools = mine
        ? '<div class="mt-6 border-t pt-4">' +
            '<p class="text-sm font-bold mb-2">Seller tools</p>' +
            '<div class="grid gap-2">' +
              '<a href="sell.html?id=' + encodeURIComponent(listing.id) + '" class="text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg">Edit details / price</a>' +
              (listing.sold
                ? '<button id="relist-btn" class="border font-semibold py-2.5 rounded-lg hover:bg-gray-50">Relist this phone</button>'
                : '<button id="sold-btn" class="border font-semibold py-2.5 rounded-lg hover:bg-gray-50">Mark as sold</button>') +
              '<button id="delete-btn" class="text-red-600 font-semibold py-2.5 rounded-lg hover:bg-red-50">Delete listing</button>' +
            '</div></div>'
        : '<div class="mt-6 border-t pt-4">' +
            '<p class="text-sm font-bold mb-1">I’m the seller</p>' +
            '<p class="text-xs text-gray-500 mb-2">Enter the phone number on this ad to edit, change the price, mark sold, or delete.</p>' +
            '<form id="unlock-form" class="flex gap-2">' +
              '<input id="unlock-phone" type="tel" placeholder="03xx-xxxxxxx" class="flex-1 p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">' +
              '<button class="bg-gray-900 text-white font-semibold px-3 rounded-lg text-sm">Unlock</button>' +
            '</form>' +
            '<p id="unlock-error" class="hidden text-xs text-red-600 mt-2"></p>' +
          '</div>';

      main.innerHTML =
        '<a href="phones.html" class="text-sm text-blue-700 hover:underline">← All used phones</a>' +
        (listing.sold ? '<div class="mt-3 bg-gray-900 text-white text-sm font-bold px-4 py-2 rounded-lg">This phone is marked sold</div>' : '') +
        '<div class="mt-4 grid gap-8 lg:grid-cols-[1.15fr_0.85fr]">' +
          '<div>' +
            '<div class="relative overflow-hidden rounded-xl border bg-white shadow-sm">' +
              '<img src="' + img + '" alt="" class="w-full aspect-[4/3] object-cover' + (listing.sold ? ' opacity-50' : '') + '">' +
              (listing.sold ? '<div class="absolute inset-0 grid place-items-center"><span class="bg-gray-900 text-white font-extrabold px-6 py-2 rounded-lg tracking-widest">SOLD</span></div>' : '') +
            '</div>' +
            '<div class="mt-6 bg-white border rounded-xl p-6">' +
              '<h2 class="font-bold text-lg mb-2">Seller comments</h2>' +
              '<p class="text-sm leading-relaxed text-gray-600">' + (listing.description || "") + '</p>' +
            '</div>' +
          '</div>' +
          '<aside class="bg-white border rounded-xl p-6 h-fit shadow-sm">' +
            '<div class="flex flex-wrap gap-1.5 mb-3">' +
              (listing.sold ? '<span class="bg-gray-900 text-white text-xs font-bold px-2 py-0.5 rounded">Sold</span>' : '') +
              (listing.featured && !listing.sold ? '<span class="bg-yellow-400 text-gray-900 text-xs font-bold px-2 py-0.5 rounded">Featured</span>' : '') +
              '<span class="' + pta.cls + ' text-xs font-bold px-2 py-0.5 rounded">' + pta.label + '</span>' +
            '</div>' +
            '<h1 class="text-2xl font-extrabold">' + ui.listingTitle(listing) + '</h1>' +
            '<p class="text-3xl font-extrabold text-blue-700 mt-2">' + ui.formatPkr(listing.pricePkr) + '</p>' +
            '<p class="text-sm text-gray-500 mt-2"><i class="fa-solid fa-location-dot mr-1"></i>' + ui.cityLabel(listing.citySlug, listing.area) + '</p>' +
            '<p class="text-xs text-gray-400 mt-1">' + ui.timeAgo(listing.createdAtHours) + '</p>' +
            '<dl class="mt-5 grid grid-cols-2 gap-3 text-sm">' +
              specs.map((s) => '<div><dt class="text-xs text-gray-400">' + s[0] + '</dt><dd class="font-semibold">' + s[1] + '</dd></div>').join("") +
            '</dl>' +
            '<div class="mt-6 border-t pt-4">' +
              '<p class="text-sm font-semibold">' + (listing.sellerName || "Seller") + '</p>' +
              (phone && !listing.sold
                ? '<a id="call-btn" href="#" class="mt-3 flex w-full items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg"><i class="fa-solid fa-phone"></i> Show seller number</a>'
                : listing.sold
                  ? '<p class="text-xs text-gray-400 mt-2">This listing is no longer available.</p>'
                  : '<p class="text-xs text-gray-400 mt-2">No phone listed.</p>') +
              '<button type="button" id="share-btn" class="mt-2 flex w-full items-center justify-center gap-2 border font-semibold py-2.5 rounded-lg hover:bg-gray-50"><i class="fa-solid fa-share-nodes"></i> Share this ad</button>' +
            '</div>' +
            sellerTools +
          '</aside>' +
        '</div>' +
        (related.length
          ? '<section class="mt-12"><h2 class="text-xl font-bold mb-5">More ' + listing.brand + ' phones</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">' + related.map(ui.cardHtml).join("") + '</div></section>'
          : '');

      const btn = document.getElementById("call-btn");
      if (btn && phone) {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const tel = phone.replace(/[^0-9+]/g, "");
          const wa = tel.replace(/^0/, "92").replace(/^\+/, "");
          btn.outerHTML =
            '<a href="tel:' + tel + '" class="mt-3 flex w-full items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg"><i class="fa-solid fa-phone"></i> ' + phone + '</a>' +
            '<a href="https://wa.me/' + wa + '" class="mt-2 flex w-full items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>';
        });
      }
      const shareBtn = document.getElementById("share-btn");
      if (shareBtn) {
        shareBtn.addEventListener("click", async () => {
          const payload = {
            title: ui.listingTitle(listing),
            text: ui.listingTitle(listing) + " — " + ui.formatPkr(listing.pricePkr),
            url: location.href
          };
          try {
            if (navigator.share) await navigator.share(payload);
            else {
              await navigator.clipboard.writeText(location.href);
              shareBtn.textContent = "Link copied";
            }
          } catch (_) {}
        });
      }

      const soldBtn = document.getElementById("sold-btn");
      if (soldBtn) {
        soldBtn.addEventListener("click", function () {
          ui.markSold(listing.id, true);
          location.reload();
        });
      }
      const relistBtn = document.getElementById("relist-btn");
      if (relistBtn) {
        relistBtn.addEventListener("click", function () {
          ui.markSold(listing.id, false);
          location.reload();
        });
      }
      const deleteBtn = document.getElementById("delete-btn");
      if (deleteBtn) {
        deleteBtn.addEventListener("click", function () {
          if (confirm("Delete this listing? Buyers will no longer see it.")) {
            ui.deleteListing(listing.id);
            location.href = "my-ads.html";
          }
        });
      }
      const unlockForm = document.getElementById("unlock-form");
      if (unlockForm) {
        unlockForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const res = ui.unlockListing(listing.id, document.getElementById("unlock-phone").value);
          if (!res.ok) {
            const err = document.getElementById("unlock-error");
            err.textContent = res.error;
            err.classList.remove("hidden");
            return;
          }
          location.reload();
        });
      }
    }
  </script>

  <script src="js/ads-config.js"></script>
  <script src="js/ads.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
