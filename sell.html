<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Mobile Ad - MobileWheels PK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-blue-700 text-white shadow-md p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold">Mobile<span class="text-yellow-400">Wheels</span></a>
      <div class="flex items-center gap-3">
        <a href="my-ads.html" class="text-sm hover:text-yellow-300">My Ads</a>
        <a href="index.html" class="text-sm bg-blue-800 px-3 py-1.5 rounded hover:bg-blue-900">← Home</a>
      </div>
    </div>
  </header>

  <div class="max-w-xl mx-auto my-8 bg-white p-8 rounded-xl shadow-md w-full">
    <h1 id="form-title" class="text-2xl font-bold mb-2 text-gray-800 text-center">Post your mobile phone ad</h1>
    <p id="form-sub" class="text-sm text-gray-500 text-center mb-6">Photos, city, area, PTA status and price — same flow as a real classifieds listing.</p>

    <form id="sell-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
        <select id="brand" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone model</label>
        <select id="model" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Storage</label>
          <select id="storage" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">RAM</label>
          <select id="ram" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Optional</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
        <select id="city" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Area</label>
        <select id="area" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">PTA status</label>
        <select id="pta" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Photo</label>
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition relative bg-gray-50">
          <img id="preview" class="hidden mx-auto mb-3 max-h-40 rounded-lg object-cover">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
          <p class="text-sm font-medium text-gray-600">Click to upload a clear photo</p>
          <p class="text-xs text-gray-400 mt-1">Leave empty to keep the current photo</p>
          <input id="photo" type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Battery health (%)</label>
          <input id="battery" type="number" min="1" max="100" placeholder="e.g. 85" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Condition</label>
          <select id="condition" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Demand price (PKR)</label>
        <input id="price" type="number" required min="1000" placeholder="e.g. 150000" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
          <input id="color" type="text" placeholder="e.g. Sierra Blue" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Year</label>
          <input id="year" type="number" min="2016" max="2026" value="2024" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your name</label>
        <input id="seller" type="text" required placeholder="Seller or shop name" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp / phone</label>
        <input id="phone" type="tel" required placeholder="03xx-xxxxxxx" class="w-full p-2.5 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone condition / description</label>
        <textarea id="description" placeholder="Screen, scratches, accessories, box pack…" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-24"></textarea>
      </div>
      <p id="error" class="hidden text-sm text-red-600"></p>
      <button id="submit-btn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg">
        Submit listing
      </button>
    </form>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const ui = MW.ui;
    const editId = ui.qs("id");
    const existing = editId ? ui.getListing(editId) : null;
    const isEdit = !!(existing && ui.isMine(existing.id));

    if (editId && !isEdit) {
      location.href = "phone.html?id=" + encodeURIComponent(editId);
    }

    const brandEl = document.getElementById("brand");
    const modelEl = document.getElementById("model");
    brandEl.innerHTML = MW.BRANDS.map((b) => '<option value="' + b.name + '">' + b.name + "</option>").join("");

    function fillModels(selected) {
      const models = MW.MODELS_BY_BRAND[brandEl.value] || [];
      let opts = models.slice();
      if (selected && opts.indexOf(selected) === -1) opts.unshift(selected);
      modelEl.innerHTML = opts.map((m) => "<option>" + m + "</option>").join("") || "<option>Other</option>";
      if (selected) modelEl.value = selected;
    }
    brandEl.addEventListener("change", function () { fillModels(); });

    document.getElementById("storage").innerHTML = MW.STORAGE_OPTIONS.map((n) =>
      '<option value="' + n + '">' + n + " GB</option>"
    ).join("");
    MW.RAM_OPTIONS.forEach((n) => {
      const o = document.createElement("option");
      o.value = n; o.textContent = n + " GB";
      document.getElementById("ram").appendChild(o);
    });
    document.getElementById("pta").innerHTML = MW.PTA.map((p) => '<option value="' + p.id + '">' + p.label + "</option>").join("");
    document.getElementById("condition").innerHTML = MW.CONDITIONS.map((c) => "<option>" + c + "</option>").join("");

    let photoData = "";

    if (isEdit) {
      document.title = "Edit ad - MobileWheels PK";
      document.getElementById("form-title").textContent = "Edit your listing";
      document.getElementById("form-sub").textContent = "Change the price, city, photos or any other detail — then save.";
      document.getElementById("submit-btn").textContent = "Save changes";
      brandEl.value = existing.brand;
      fillModels(existing.model);
      document.getElementById("storage").value = existing.storageGb || 128;
      document.getElementById("ram").value = existing.ramGb || "";
      document.getElementById("pta").value = existing.ptaStatus || "official";
      document.getElementById("condition").value = existing.condition || "9/10";
      document.getElementById("battery").value = existing.batteryHealth || "";
      document.getElementById("price").value = existing.pricePkr || "";
      document.getElementById("color").value = existing.color || "";
      document.getElementById("year").value = existing.year || 2024;
      document.getElementById("seller").value = existing.sellerName || "";
      document.getElementById("phone").value = existing.contactPhone || "";
      document.getElementById("description").value = existing.description || "";
      ui.bindCityArea(document.getElementById("city"), document.getElementById("area"), {
        allowAll: false,
        city: existing.citySlug,
        area: existing.area
      });
      if (existing.imageUrl) {
        const img = document.getElementById("preview");
        img.src = existing.imageUrl;
        img.classList.remove("hidden");
        photoData = existing.imageUrl;
      }
    } else {
      fillModels();
      document.getElementById("storage").value = "128";
      ui.bindCityArea(document.getElementById("city"), document.getElementById("area"), { allowAll: false });
    }

    document.getElementById("photo").addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const bitmap = await createImageBitmap(file);
        const max = 1200;
        const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        let q = 0.72;
        photoData = canvas.toDataURL("image/jpeg", q);
        while (photoData.length > 350000 && q > 0.4) {
          q -= 0.08;
          photoData = canvas.toDataURL("image/jpeg", q);
        }
        const img = document.getElementById("preview");
        img.src = photoData;
        img.classList.remove("hidden");
      } catch {
        document.getElementById("error").textContent = "Could not read that photo. Try a JPG or PNG.";
        document.getElementById("error").classList.remove("hidden");
      }
    });

    document.getElementById("sell-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const city = document.getElementById("city").value;
      const area = document.getElementById("area").value;
      if (!city || !area) {
        document.getElementById("error").textContent = "Pick a city and area.";
        document.getElementById("error").classList.remove("hidden");
        return;
      }
      const payload = {
        brand: brandEl.value,
        model: modelEl.value,
        storageGb: Number(document.getElementById("storage").value) || null,
        ramGb: Number(document.getElementById("ram").value) || null,
        pricePkr: Number(document.getElementById("price").value),
        citySlug: city,
        area: area,
        ptaStatus: document.getElementById("pta").value,
        batteryHealth: Number(document.getElementById("battery").value) || null,
        condition: document.getElementById("condition").value,
        description: document.getElementById("description").value,
        color: document.getElementById("color").value,
        year: Number(document.getElementById("year").value) || null,
        imageUrl: photoData || ui.brandImage(brandEl.value, modelEl.value),
        sellerName: document.getElementById("seller").value,
        contactPhone: document.getElementById("phone").value
      };
      if (isEdit) {
        ui.updateListing(existing.id, payload);
        location.href = "phone.html?id=" + encodeURIComponent(existing.id);
        return;
      }
      payload.id = "user-" + Date.now();
      payload.featured = false;
      payload.sold = false;
      payload.createdAtHours = 0;
      ui.saveUserListing(payload);
      location.href = "phone.html?id=" + encodeURIComponent(payload.id);
    });
  </script>
</body>
</html>
