<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Mobile Ad - MobileWheels PK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-700 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold">Mobile<span class="text-yellow-400">Wheels</span></a>
            <a href="index.html" class="text-sm bg-blue-800 px-3 py-1.5 rounded hover:bg-blue-900">← Back to Home</a>
        </div>
    </header>

    <div class="max-w-xl mx-auto my-8 bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Post Your Mobile Phone Ad</h2>
        
        <form class="space-y-4">
            <!-- Brand -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>
                <select class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Select Brand</option>
                    <option>Apple</option>
                    <option>Samsung</option>
                    <option>Xiaomi / Redmi</option>
                    <option>Vivo</option>
                    <option>Oppo</option>
                    <option>Infinix</option>
                </select>
            </div>

            <!-- Model -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Model</label>
                <input type="text" placeholder="e.g. iPhone 13 Pro Max" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- City -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
                <select class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Select City</option>
                    <option>Karachi</option>
                    <option>Lahore</option>
                    <option>Islamabad</option>
                    <option>Rawalpindi</option>
                </select>
            </div>

            <!-- PTA Status -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PTA Status</label>
                <select class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Official PTA Approved</option>
                    <option>Non-PTA (Tax Pending)</option>
                    <option>CPID / Patch Approved</option>
                    <option>JV (SIM Locked)</option>
                </select>
            </div>

            <!-- Photo Upload Section -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Upload Photos (Max 5)</label>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer relative bg-gray-50">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-2"></i>
                    <p class="text-sm font-medium text-gray-600">Click or drag photos here to upload</p>
                    <p class="text-xs text-gray-400 mt-1">Upload clear photos of front, back, and IMEI/settings</p>
                    <input type="file" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
            </div>

            <!-- Battery Health -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Battery Health (%)</label>
                <input type="number" min="1" max="100" placeholder="e.g. 85" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Demand Price -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Demand Price (PKR)</label>
                <input type="number" placeholder="e.g. 150000" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Description -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Condition / Description</label>
                <textarea placeholder="Describe screen condition, scratches, accessories included, etc." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-24"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition duration-200">
                Submit Listing
            </button>
        </form>
    </div>

</body>
</html>
