<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Used Phone - Mobile Marketplace Pakistan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Post Your Mobile Phone Ad</h2>
        
        <form class="space-y-4">
            <!-- Brand -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Brand</label>

                <select class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Select Brand</option>
                    <option>Apple</option>
                    <option>Samsung</option>
                    <option>Xiaomi / Redmi</option>
                    <option>Vivo</option>
                    <option>Oppo</option>
                    <option>Infinix</option>
                    <option>Tecno</option>
                </select>
            </div>

            <!-- Model -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone Model</label>

                <input type="text" placeholder="e.g. iPhone 13 Pro Max, Galaxy S23" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- City -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">City</label>

                <select class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Select City</option>
                    <option>Karachi</option>
                    <option>Lahore</option>
                    <option>Islamabad</option>
                    <option>Rawalpindi</option>
                    <option>Faisalabad</option>
                    <option>Peshawar</option>
                    <option>Multan</option>
                </select>
            </div>

            <!-- PTA Status -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PTA Status</label>

                <select class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>Official PTA Approved</option>
                    <option>Non-PTA (Tax Pending)</option>
                    <option>CPID / Patch Approved</option>
                    <option>JV (SIM Locked)</option>
                </select>
            </div>

            <!-- Battery Health -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Battery Health (%)</label>

                <input type="number" min="1" max="100" placeholder="e.g. 85" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Price -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Demand Price (PKR)</label>

                <input type="number" placeholder="e.g. 150000" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition duration-200 mt-4">
                Post Mobile Ad
            </button>
        </form>
    </div>

</body>
</html>
